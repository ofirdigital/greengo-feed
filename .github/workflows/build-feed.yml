name: Build OpenAI Ads feed (Green Go)

on:
  schedule:
    - cron: "15 3,15 * * *"   # 06:15 and 18:15 Israel time (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CSV from the Merchant XML
        run: |
          python3 build_openai_feed.py --out docs/products.csv --report docs/report.txt ${{ hashFiles('labels.csv') != '' && '--labels labels.csv' || '' }}
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/products.csv docs/report.txt
          git diff --cached --quiet || git commit -m "feed: rebuild $(date -u +%FT%TZ)"
          git push
